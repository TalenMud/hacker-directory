name: Validate contributor PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # This is the base branch, not the PR. The PR's own files are read over
      # the API — see .github/scripts/read-pr-file.js.
      - name: Checkout base repo (for scripts)
        uses: actions/checkout@v4

      - name: Get changed files
        id: changed
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              }
            );
            // `status` tells a deleted file apart from one we failed to read.
            const entries = files.map((f) => ({ path: f.filename, status: f.status }));
            core.setOutput("files", JSON.stringify(entries));
            return entries;

      - name: Validate card.json files
        id: validate
        uses: actions/github-script@v7
        # Filenames come from the PR author, so they go through the environment.
        # Interpolating them into the script body would run them as code.
        env:
          PR_FILES: ${{ steps.changed.outputs.files }}
        with:
          script: |
            const readPrFile = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/read-pr-file.js`)(github, context);
            const entries = JSON.parse(process.env.PR_FILES || "[]");
            const cardFiles = entries.filter((f) => /^contributors\/[^/]+\/card\.json$/.test(f.path));

            const errors = [];
            const warnings = [];
            const REQUIRED_FIELDS = ["name", "github", "bio", "tags"];

            for (const { path: file, status } of cardFiles) {
              if (status === "removed") {
                errors.push(`\`${file}\` was deleted — that's the file that puts you on the grid.`);
                continue;
              }

              let raw;
              try {
                raw = await readPrFile(file);
              } catch (e) {
                errors.push(`Could not read \`${file}\` from this PR: ${e.message}`);
                continue;
              }

              let json;
              try {
                json = JSON.parse(raw);
              } catch (e) {
                errors.push(`\`${file}\` is not valid JSON: ${e.message}`);
                continue;
              }

              // The checks below use `in`, which throws on anything but an object.
              if (json === null || typeof json !== "object" || Array.isArray(json)) {
                errors.push(`\`${file}\` must be a JSON object wrapped in \`{ }\`.`);
                continue;
              }

              for (const field of REQUIRED_FIELDS) {
                if (!(field in json) || json[field] === "" || json[field] == null) {
                  errors.push(`\`${file}\` is missing the required field \`"${field}"\`.`);
                }
              }

              if ("tags" in json && !Array.isArray(json.tags)) {
                errors.push(`\`${file}\`: \`"tags"\` must be an array, e.g. \`["Python", "React"]\`.`);
              }

              const folderUsername = file.split("/")[1];
              if ("github" in json && json.github != null && typeof json.github !== "string") {
                errors.push(`\`${file}\`: \`"github"\` must be text in quotes, e.g. \`"your-username"\`.`);
              } else if (json.github && json.github.toLowerCase() !== folderUsername.toLowerCase()) {
                warnings.push(
                  `\`${file}\`: the \`"github"\` field ("${json.github}") doesn't match the folder name ("${folderUsername}").`
                );
              }

              // location is opt-in and meant to be coarse (city/country) — a
              // "lat, lng"-shaped value usually means someone pasted exact
              // coordinates, which is more precise than this field is for.
              const COORDINATE_PATTERN = /^-?\d{1,3}(\.\d+)?\s*,\s*-?\d{1,3}(\.\d+)?$/;
              if (typeof json.location === "string" && COORDINATE_PATTERN.test(json.location.trim())) {
                warnings.push(
                  `\`${file}\`: \`"location"\` looks like exact coordinates. Please use a city or country instead, e.g. \`"Cardiff, UK"\`.`
                );
              }
            }

            core.setOutput("errorCount", errors.length.toString());
            core.setOutput("errors", JSON.stringify(errors));
            core.setOutput("warnings", JSON.stringify(warnings));
            return { errors, warnings };

      - name: Check PR scope (own folder only?)
        id: scope
        uses: actions/github-script@v7
        env:
          PR_FILES: ${{ steps.changed.outputs.files }}
        with:
          script: |
            const entries = JSON.parse(process.env.PR_FILES || "[]");
            const author = context.payload.pull_request.user.login.toLowerCase();

            const allowed = entries.every(({ path: p }) => {
              if (p === "contributors/manifest.json") return true;
              const match = p.match(/^contributors\/([^/]+)\//);
              return match && match[1].toLowerCase() === author;
            });

            core.setOutput("selfScoped", allowed.toString());
            return allowed;

      - name: Content & image safety check
        id: moderate
        uses: actions/github-script@v7
        env:
          PR_FILES: ${{ steps.changed.outputs.files }}
        with:
          script: |
            const fs = require("fs");
            const readPrFile = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/read-pr-file.js`)(github, context);

            const paths = JSON.parse(process.env.PR_FILES || "[]")
              .filter((f) => f.status !== "removed")
              .map((f) => f.path);

            const cardFiles = paths.filter((p) => /^contributors\/[^/]+\/card\.json$/.test(p));
            const htmlFiles = paths.filter((p) => /^contributors\/[^/]+\/.*\.html$/.test(p));
            const cssFiles = paths.filter((p) => /^contributors\/[^/]+\/.*\.css$/.test(p));
            const imageExtPattern = /\.(png|jpe?g|gif|webp|svg|bmp|avif)$/i;
            const newImageFiles = paths.filter((p) => /^contributors\//.test(p) && imageExtPattern.test(p));

            // Read from the base checkout: a PR must not get to edit the list
            // it's being checked against.
            const { words } = JSON.parse(fs.readFileSync(".github/scripts/blocklist.json", "utf8"));
            const flags = [];

            function scanText(label, text) {
              if (!text) return;
              const lower = String(text).toLowerCase();
              for (const word of words) {
                if (lower.includes(word)) {
                  flags.push(`Found a flagged word in ${label}.`);
                  return;
                }
              }
            }

            for (const file of cardFiles) {
              let json;
              try {
                json = JSON.parse(await readPrFile(file));
              } catch (e) {
                continue; // already reported by the card.json validator
              }
              scanText(`\`${file}\` ("name")`, json.name);
              scanText(`\`${file}\` ("role")`, json.role);
              scanText(`\`${file}\` ("bio")`, json.bio);
              scanText(`\`${file}\` ("university")`, json.university);
              scanText(`\`${file}\` ("location")`, json.location);
              if (Array.isArray(json.tags)) {
                for (const tag of json.tags) scanText(`\`${file}\` ("tags")`, tag);
              }
            }

            // Any embedded image that isn't the contributor's own GitHub avatar,
            // or any new image file committed into the PR, is worth a manual
            // look — there's no image moderation running in CI, so we just
            // point it out rather than guessing.
            const GITHUB_AVATAR_PATTERN = /^https:\/\/github\.com\/[^/]+\.png(\?.*)?$/i;

            for (const file of htmlFiles.concat(cssFiles)) {
              let text;
              try {
                text = await readPrFile(file);
              } catch (e) {
                flags.push(`Could not read \`${file}\` to scan it — worth a look by hand.`);
                continue;
              }
              const srcMatches = [...text.matchAll(/(?:src|href)\s*=\s*["']([^"']+)["']/gi)].map((m) => m[1]);
              const bgMatches = [...text.matchAll(/url\(\s*["']?([^"')]+)["']?\s*\)/gi)].map((m) => m[1]);
              const allRefs = [...srcMatches, ...bgMatches].filter((ref) => imageExtPattern.test(ref));

              for (const ref of allRefs) {
                if (GITHUB_AVATAR_PATTERN.test(ref)) continue;
                flags.push(`\`${file}\` references an image (\`${ref}\`) that isn't a GitHub avatar URL.`);
              }
            }

            for (const img of newImageFiles) {
              flags.push(`New image file \`${img}\` was added.`);
            }

            core.setOutput("flagCount", flags.length.toString());
            core.setOutput("flags", JSON.stringify(flags));
            return flags;

      - name: Post summary comment
        # Runs even if a step above blew up, so a failing check always explains
        # itself instead of leaving a bare red X.
        if: always()
        uses: actions/github-script@v7
        env:
          ERRORS: ${{ steps.validate.outputs.errors }}
          WARNINGS: ${{ steps.validate.outputs.warnings }}
          FLAGS: ${{ steps.moderate.outputs.flags }}
          SELF_SCOPED: ${{ steps.scope.outputs.selfScoped }}
          CHECKS_RAN: ${{ steps.validate.outcome == 'success' && steps.scope.outcome == 'success' && steps.moderate.outcome == 'success' }}
        with:
          script: |
            const MARKER = "<!-- automated-pr-check -->";

            const errors = JSON.parse(process.env.ERRORS || '[]');
            const warnings = JSON.parse(process.env.WARNINGS || '[]');
            const flags = JSON.parse(process.env.FLAGS || '[]');
            const selfScoped = process.env.SELF_SCOPED === 'true';
            const checksRan = process.env.CHECKS_RAN === 'true';

            const lines = [MARKER, "### 🔍 Automated PR check\n"];

            if (!checksRan) {
              // Without this the empty outputs of a crashed step would read as a pass.
              lines.push("**🧰 This check didn't finish — that's a problem with the check, not your PR.** A maintainer will look at the run log.\n");
            } else if (errors.length > 0) {
              lines.push("**❌ card.json problems (please fix):**");
              lines.push(...errors.map((e) => `- ${e}`));
              lines.push("");
            } else {
              lines.push("✅ card.json looks valid.\n");
            }

            if (!selfScoped) {
              lines.push("**📁 Scope:** this PR touches files outside `contributors/<your-username>/` — worth a closer look.\n");
            } else if (checksRan) {
              lines.push("✅ Only touches the author's own contributor folder.\n");
            }

            if (flags.length > 0) {
              lines.push("**🛡️ Content/image flags (not necessarily a problem, just worth a look):**");
              lines.push(...flags.map((f) => `- ${f}`));
              lines.push("");
            }

            if (warnings.length > 0) {
              lines.push("**⚠️ Heads up:**");
              lines.push(...warnings.map((w) => `- ${w}`));
              lines.push("");
            }

            lines.push(
              "_This repo reviews and merges every PR by hand — no auto-merge here. A maintainer will take a look soon!_"
            );

            const body = lines.join("\n");
            const issue_number = context.payload.pull_request.number;

            // Reuse our own comment so pushing to the branch doesn't stack up copies.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const existing = comments.find((c) => c.user.type === "Bot" && c.body?.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

            if (!checksRan) {
              core.setFailed("PR check did not complete");
            } else if (errors.length > 0) {
              core.setFailed("card.json validation failed");
            }
